<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cutscene panel preview</title>
<style>
body{margin:0;background:#05070b;color:#eee;font:16px/1.4 system-ui,sans-serif}
#box{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(820px,92vw);background:rgba(10,14,24,.88);border:2px solid #f4ecd8;border-radius:10px;padding:14px 18px;z-index:30}
#meta{position:fixed;top:10px;left:12px;z-index:30;font-size:13px;opacity:.8}
#ctl{position:fixed;top:10px;right:12px;z-index:30}
button{font:inherit;padding:4px 10px;margin-left:4px}
</style>
<script src="comic-data.js?v=gn1"></script><script src="comic.js?v=gn1"></script></head>
<body>
<div id="meta"></div>
<div id="ctl"><button id="prev">Back</button><button id="play">Pause</button><button id="next">Next</button></div>
<div id="box"></div>
<script>
/* Steps through every mapped cutscene line in story order, the way the game calls the panel layer.
   Lets the panels be checked on any computer, without starting the 3D game. ?at=E08 starts at a chapter. */
const L=COMIC_DATA.lines;let i=0,timer=null;
const at=new URLSearchParams(location.search).get("at");
if(at){const j=L.findIndex(l=>l[1]&&l[1].startsWith(at));if(j>=0)i=j;}
function go(n){i=Math.max(0,Math.min(L.length-1,n));__COMIC.end();__COMIC.line(L[i][0]);
document.getElementById("box").textContent=L[i][0];
document.getElementById("meta").textContent=(i+1)+" / "+L.length+"  ·  "+(L[i][1]||"back to 3D");}
function play(){clearInterval(timer);timer=setInterval(()=>{if(i<L.length-1){i++;__COMIC.line(L[i][0]);
document.getElementById("box").textContent=L[i][0];document.getElementById("meta").textContent=(i+1)+" / "+L.length+"  ·  "+(L[i][1]||"back to 3D");}},4000);}
document.getElementById("next").onclick=()=>{go(i+1)};document.getElementById("prev").onclick=()=>{go(i-1)};
document.getElementById("play").onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent="Play";}else{play();e.target.textContent="Pause";}};
go(i);play();
</script></body></html>
