<h1>Book voice check</h1><p>Each line plays straight from the audiobook chapter, exactly as the game will. Status shows <b>book</b> when the book clip played, <b>game clip</b> if it fell back.</p>

var fellBack={};window.VPLAY=function(f){fellBack[f]=1;var a=new Audio();setTimeout(function(){a.dispatchEvent(new Event("ended"))},300);return a};
</script><script src="bookvoice.js?v=bv1"></script>
<script>
var ROWS=[["v3d_dus_0004_narrator.mp3", "narrator", "The wind blew, and the whole forest sang. It was the saddest song Rook had ever heard. It didn't have words, but it didn't need them. It sounded like someone saying goodbye.", "dus"], ["v3d_dus_0006_narrator.mp3", "narrator", "Rook opened his mouth to answer, and his head went BONK against the underside of the top bunk.", "dus"], ["v3d_dus_0008_narrator.mp3", "narrator", "He had practiced how he would stand. He had set three alarms. He looked at the clock. All three alarms had gone off.", "dus"], ["v3d_dus_0009_narrator.mp3", "narrator", "He closed his eyes. I wish, he thought, that my partner likes me.", "dus"], ["v3d_dus_0011_vashti.mp3", "vashti", "Gloopa. And Sporix. Plasma, Hydro, and Bio. Fire, water, and plant. They each came to us from the Starfall.", "dus"], ["v3d_dus_0012_vashti.mp3", "vashti", "Don't choose with your head. Your head will tell you which one wins the most battles. Choose with your heart.", "dus"], ["v3d_dus_0014_narrator.mp3", "narrator", "And then Plazmo's little body began to scrunch up. The saucer's eye went very wide. Ah… went Plazmo. Ah… AH…", "dus"], ["v3d_dus_0015_narrator.mp3", "narrator", "A shower of bright orange sparks sprayed across the table and landed right on top of Dr. Vashti's notes, a whole stack of papers covered in tiny careful handwriting.", "dus"], ["v3d_dus_0016_vashti.mp3", "vashti", "My notes!", "dus"], ["v3d_dus_0018_narrator.mp3", "narrator", "Then she tucked Gloopa under her arm, inside the flap of her father's big jacket, turned around, and walked out of the Observatory without saying goodbye.", "dus"], ["v3d_dus_0022_narrator.mp3", "narrator", "Far below the town, at the bottom of the deepest canyon, stretched the old stone bridge. Nobody knew who had built it. It was older than Dustmere, older than anybody's grandparents, and it was carved all over with strange swirling marks that nobody could read.", "dus"], ["v3d_dus_0025_narrator.mp3", "narrator", "Halfway down, one of the shadows moved. Rook yelped and nearly jumped out of his boots. Plazmo flared up bright as a bonfire. And standing in the.", "dus"], ["v3d_dus_0026_rook.mp3", "rook", "Friendly is good. Right?", "dus"], ["v3d_dus_0027_narrator.mp3", "narrator", "The hum came up through his boots. It went into his knees, into his stomach, into his chest, until it felt like his own heart was humming along with it.", "dus"], ["v3d_dus_0031_narrator.mp3", "narrator", "Sparks sprayed out across the bridge like fireworks, bouncing and fizzing on the glowing stones. Rook started laughing so hard that he had to sit down right there in the middle of the bridge.", "dus"], ["v3d_dus_0032_rook.mp3", "rook", "You need a name.", "dus"], ["v3d_dus_0035_narrator.mp3", "narrator", "Rook decided that meant yes. Rook got home with exactly one minute to spare.", "dus"], ["v3d_dus_0038_vashti.mp3", "vashti", "Well! Let's, ah, let's have a look at our little visitor, shall we?", "dus"], ["v3d_dus_0040_vashti.mp3", "vashti", "It's not in any database. There are over three hundred known species of Alienmon, and it isn't any of them.", "dus"], ["v3d_dus_0041_rook.mp3", "rook", "Well, I think he's the best mystery ever, Come on, Zib. Let's go show Mom.", "dus"], ["v3d_dus_0044_mom.mp3", "mom", "Oh, he's darling. Your Nana Wren would have loved him.", "dus"], ["v3d_dus_0045_narrator.mp3", "narrator", "Rook was on his fourth pancake when someone knocked on the door. It was a boy from down the street, a little kid called Bram, with a gap where his front teeth used to be. He was out of breath.", "dus"], ["v3d_dus_0048_sola.mp3", "sola", "Whatever. You and me. Right now. Unless you're scared.", "dus"], ["v3d_dus_0049_rook.mp3", "rook", "We're not scared.", "dus"], ["v3d_dus_0050_guard.mp3", "guard", "One-on-one! No hitting trainers, no fighting dirty, and no knocking over my lemonade stand AGAIN!", "dus"], ["v3d_dus_0051_narrator.mp3", "narrator", "Its flame had shrunk down to the size of a candle.", "dus"], ["v3d_dus_0054_narrator.mp3", "narrator", "She wasn't angry, he realized. Not really. She was sad. She was so sad that it was spilling over.", "dus"], ["v3d_dus_0057_rook.mp3", "rook", "I kept yelling the same thing. Spark Burst, Spark Burst, Spark Burst. Over and over. Even after it didn't work the first time. Even after it didn't work the second time. I just.", "dus"], ["v3d_dus_0058_rook.mp3", "rook", "Sola didn't shout. She watched, and waited, and then did the thing that would work. We have to be like that.", "dus"], ["v3d_dus_0077_narrator.mp3", "narrator", "When the dust cleared, Rumbler was sitting down hard on its bottom.", "dus"], ["v3d_dus_0085_vashti.mp3", "vashti", "Eight Relay Towers. Each has a Keeper and a crystal heart. Win, and the Keeper gives you a Signal Shard.", "dus"], ["v3d_dus_0087_vashti.mp3", "vashti", "Sola left this morning, On the dawn freight wagon. Before the sun was even up. She's going to the towers too, I think. Though I don't think it's Signal Shards she's looking for.", "dus"], ["v3d_dus_0088_vashti.mp3", "vashti", "Go home and pack. You'll want more socks than you think.", "dus"], ["v3d_dus_0090_mom.mp3", "mom", "She used to say it wasn't a badge at all. It was a promise.", "dus"], ["v3d_dus_0092_narrator.mp3", "narrator", "That evening, the whole town gathered at the Bonfire Ring to say goodbye. The Bonfire Ring was a circle of flat stones at the edge of the plaza, where the people of Dustmere.", "dus"], ["v3d_dus_0093_narrator.mp3", "narrator", "Somebody brought a guitar. Somebody brought a pot of spicy bean stew. Mr. Abernathy brought warm honey rolls.", "dus"], ["v3d_dus_0095_dusty.mp3", "dusty", "At the bottom, in the purple glow, they found the biggest star-seed of all. When they touched it, it cracked open like an egg.", "dus"], ["v3d_dus_0096_dusty.mp3", "dusty", "Some folks say there was a flat stone inside. Smooth as glass, with writing nobody had ever seen.", "dus"], ["v3d_dus_0102_narrator.mp3", "narrator", "One by one, the blue lanterns flicker back to life.", "dus"], ["v3d_dus_0103_narrator.mp3", "narrator", "What was Phase Two? Who was the Director? And why, out of all the Alienmon on all fourteen worlds, did they want Zib?", "dus"], ["v3d_dus_0106_narrator.mp3", "narrator", "And wedged in the corner, half hidden behind his squashed sandwich, with crumbs all down its front, were two round, shiny, terrified eyes, peeking out from under a red mushroom cap with white spots.", "dus"], ["v3d_dus_0107_rook.mp3", "rook", "You followed me? All the way from Dustmere?", "dus"], ["v3d_dus_0114_narrator.mp3", "narrator", "It was as if, after spending his whole life in a desert, he had finally walked into a room full of his cousins.", "dus"], ["v3d_dus_0116_rook.mp3", "rook", "It's the heat! You need water and shade...", "dus"], ["v3d_dus_0121_nurse.mp3", "nurse", "She sat up with it for three nights. Three whole nights. She held it, and she talked to it, and she sang to it, and she never once let it be alone. And on the fourth morning, its light came back on.", "dus"], ["v3d_dus_0122_nurse.mp3", "nurse", "She wrote it all down in a little blue notebook, and kept it on that funny old starship of hers. Cream and pink, like a cake.", "dus"], ["v3d_dus_0123_rook.mp3", "rook", "Nana Wren had a STARSHIP?", "dus"], ["v3d_dus_0126_narrator.mp3", "narrator", "One mark on the ring flickers blue. Just once. Like something waking up.", "dus"], ["v3d_dus_0130_narrator.mp3", "narrator", "From deep inside the dead console comes a sound like a hundred tiny bells.", "dus"], ["v3d_dus_0131_kit.mp3", "kit", "Eight, Eight of something. All hooked together.", "dus"], ["v3d_dus_0134_narrator.mp3", "narrator", "It turned around, toddled over on its little feet, and climbed right up into Kit's lap.", "dus"], ["v3d_dus_0135_kit.mp3", "kit", "It... picked me? Nobody's ever picked me first. Not for anything.", "dus"], ["v3d_dus_0138_narrator.mp3", "narrator", "He pulled his goggles down over his eyes, as if he didn't want anybody to see them.", "dus"], ["v3d_dus_0146_kit.mp3", "kit", "This gate's not just a gate. It's part of something bigger. Way bigger.", "dus"], ["v3d_dus_0148_guard.mp3", "guard", "No hitting trainers, no fighting dirty, and no knocking over my lemonade stand AGAIN!", "dus"], ["v3d_dus_0291_townsman.mp3", "townsman", "Some of the mushrooms out there are going gray. Mum says not to go near.", "dus"], ["v3d_dus_0340_rook.mp3", "rook", "Want to be my partner, buddy?", "dus"], ["v3d_dus_0341_sola.mp3", "sola", "I'll take this one. Gloopa. Water beats fire. It's the one that beats yours.", "dus"], ["v3d_dus_0342_rook.mp3", "rook", "Are you thinking what I'm thinking?", "dus"], ["v3d_dus_0343_rook.mp3", "rook", "DX-4! You scared me half to death!", "dus"], ["v3d_dus_0344_vashti.mp3", "vashti", "After twenty years... hello again, little one.", "dus"], ["v3d_dus_0345_townsman.mp3", "townsman", "Rook! Sola Reyes is at the Trading Post. She says she's waiting for you.", "dus"], ["v3d_dus_0346_rook.mp3", "rook", "Waiting for me? For what?", "dus"], ["v3d_dus_0347_sola.mp3", "sola", "Heard you found some weird little robot last night.", "dus"], ["v3d_dus_0348_rook.mp3", "rook", "He's not a robot. He's Zib.", "dus"], ["v3d_dus_0351_vashti.mp3", "vashti", "Zib's frequency and the towers' frequency. They match, like two notes in the same song.", "dus"], ["v3d_dus_0352_rook.mp3", "rook", "So if I want to find out where Zib came from... I should go to the towers.", "dus"], ["v3d_dus_0353_rook.mp3", "rook", "Her dad.", "dus"], ["v3d_dus_0354_mom.mp3", "mom", "This belonged to your Nana Wren. She was the very first nurse at the Recovery Bay. She healed Alienmon for forty years.", "dus"], ["v3d_dus_0355_rook.mp3", "rook", "A promise to do what?", "dus"], ["v3d_dus_0356_mom.mp3", "mom", "Never give up on anybody.", "dus"], ["v3d_dus_0357_rook.mp3", "rook", "I think it means you'll miss me.", "dus"], ["v3d_dus_0358_rook.mp3", "rook", "Who were they? The four kids?", "dus"], ["v3d_dus_0359_dusty.mp3", "dusty", "That, is a story for another night.", "dus"], ["v3d_dus_0360_narrator.mp3", "narrator", ": Go home, kid. Please.", "dus"], ["v3d_dus_0361_kit.mp3", "kit", "It's a big old rock that doesn't do anything.", "dus"], ["v3d_dus_0362_kit.mp3", "kit", "I've been trying to fix this console for three weeks. It's dead. Totally, completely dead.", "dus"], ["v3d_dus_0363_rook.mp3", "rook", "Where are you from?", "dus"], ["v3d_dus_0364_kit.mp3", "kit", "...Nowhere. A scrap world. Doesn't matter.", "dus"], ["v3d_dus_0365_kit.mp3", "kit", "...Okay. It's not totally dead.", "dus"], ["v3d_dus_0366_rook.mp3", "rook", "Looks like it waited for the right person.", "dus"], ["v3d_dus_0367_kit.mp3", "kit", "Yeah. I know exactly where it goes. It goes home.", "dus"], ["v3d_fer_0003_narrator.mp3", "narrator", "And then his boots hit solid ground with a clang, and he stumbled forward three steps and sat down hard on something cold and bumpy. He opened his eyes. He was sitting on a pile of bolts.", "fer"], ["v3d_fer_0004_narrator.mp3", "narrator", "He had come through upside down and was still spinning slowly, like a coin on a table.", "fer"], ["v3d_fer_0006_narrator.mp3", "narrator", "It is not the way most people say home sweet home.", "fer"], ["v3d_fer_0007_kit.mp3", "kit", "Twenty years ago, during the Starfall, more seeds fell on Ferrox than anywhere else. The shells were left behind. Harder than steel. So people started building with them.", "fer"], ["v3d_fer_0009_kit.mp3", "kit", "Two hands. It was two hands. And it was a small train car.", "fer"], ["v3d_fer_0011_narrator.mp3", "narrator", "Kit laughed. It was a small laugh, but it was a real one.", "fer"], ["v3d_fer_0013_narrator.mp3", "narrator", "Very carefully, they moved one pipe, and then another, and then a big bent sheet of tin. Underneath, huddled together in a little hollow, was a whole family of Alienmon.", "fer"], ["v3d_fer_0015_narrator.mp3", "narrator", "Then they set off along the Scrap Route, with four Cogglets rolling along behind them in a wobbly line and the little rust slug riding on top of Cactling's head, because it was very, very slow, which Cactling permitted with an expression of enormous patience.", "fer"], ["v3d_fer_0017_narrator.mp3", "narrator", "When he saw the Cogglet, he put down his sandwich and held out his hand, and the Cogglet rolled right up into it.", "fer"], ["v3d_fer_0018_oduya.mp3", "oduya", "Well, now. I've been needing a fireman for years. Somebody to watch the gauges while I watch the track.", "fer"], ["v3d_fer_0019_oduya.mp3", "oduya", "What do you say, little gear? Want to ride the rails?", "fer"], ["v3d_fer_0021_narrator.mp3", "narrator", "A gang of kids ran a stall there selling fixed-up toys, and when they saw the Cogglets, they shrieked so loudly that the whole market turned around.", "fer"], ["v3d_fer_0023_narrator.mp3", "narrator", "Two of the Cogglets were immediately swarmed, hugged, named (Sprocket and Lady Twinkletooth), and given a job sorting screws by color, which they turned out to be wonderful at.", "fer"], ["v3d_fer_0024_narrator.mp3", "narrator", "The fourth Cogglet rolled right up the side of the tower, wedged itself into the pipe where the leak was, turned a quarter of the way around, and stopped the leak dead.", "fer"], ["v3d_fer_0025_narrator.mp3", "narrator", "The lady stared at it. Then she burst out laughing.", "fer"], ["v3d_fer_0027_narrator.mp3", "narrator", "And there was only one Alienmon left. The little rust slug. It had climbed down off Cactling's head by now. It was sitting in the middle of the road, watching the last Cogglet go rolling happily up into the water tower. Its eyestalks had drooped.", "fer"], ["v3d_fer_0028_narrator.mp3", "narrator", "It had been guarding the Cogglets this whole time, Rook realized. Through all those days out in the scrap. Being brave for them. Being the one who growled. And now they all had homes, and they were all happy, and it was all alone.", "fer"], ["v3d_fer_0029_rook.mp3", "rook", "What is it?", "fer"], ["v3d_fer_0030_kit.mp3", "kit", "A Gleamgrub. A rust slug. Toxin and Alloy. Their slime turns steel to rust, and then they eat the rust.", "fer"], ["v3d_fer_0031_kit.mp3", "kit", "That's why the Cogglets weren't even rustier. It was eating the rust off them to keep them going. Weren't you?", "fer"], ["v3d_fer_0034_narrator.mp3", "narrator", "The Gleamgrub burped, very politely. Then it started on the right side.", "fer"], ["v3d_fer_0035_kit.mp3", "kit", "Hey. Do you want to come with me? Sporix already picked me, and that's different. This is me asking. If you want.", "fer"], ["v3d_fer_0036_narrator.mp3", "narrator", "Then it climbed up onto Kit's knee, tucked itself snugly into its rusty shell, and drew its eyestalks down until its green eyes closed.", "fer"], ["v3d_fer_0037_narrator.mp3", "narrator", "A wobbly cyan beam, a tinkle of wind chimes and one small clunk. GLEAMGRUB. PARTNER CONFIRMED.", "fer"], ["v3d_fer_0038_narrator.mp3", "narrator", "He didn't say anything. But he was smiling so hard his goggles were crooked.", "fer"], ["v3d_fer_0040_kit.mp3", "kit", "I used to hide here when I was little. When people came to see Dad battle and kept asking when I'd be a battler like him.", "fer"], ["v3d_fer_0041_kit.mp3", "kit", "I'm not a battler. I fix stuff. It's not the same.", "fer"], ["v3d_fer_0042_rook.mp3", "rook", "These drawings are really good.", "fer"], ["v3d_fer_0044_narrator.mp3", "narrator", "Plazmo floated by the stove, keeping it warm. Cactling slept in the doorway, guarding it. Sporix and Gleamgrub curled up together in Kit's bunk, one soft and one shelled, like a pillow and a rusty tin can.", "fer"], ["v3d_fer_0050_narrator.mp3", "narrator", "Far away, the great crystal glows a steady, beautiful blue. Not a flicker.", "fer"], ["v3d_fer_0051_narrator.mp3", "narrator", "Rook looked at the soot on Kit's cheek. He looked at the tower. He decided not to say anything. But he wondered.", "fer"], ["v3d_fer_0053_hank.mp3", "hank", "Sir! Hear that, Kit? He called me sir!", "fer"], ["v3d_fer_0055_hank.mp3", "hank", "Hiya, kiddo. You came home.", "fer"], ["v3d_fer_0056_narrator.mp3", "narrator", "A little pause. Two people with a hundred things to say, and neither knows which one to say first.", "fer"], ["v3d_fer_0061_hank.mp3", "hank", "That was smart. And that was the bravest little fire I've ever seen. Nobody's ever done that to old Anvilox before. Where'd you learn that trick, son?", "fer"], ["v3d_fer_0062_narrator.mp3", "narrator", "Rook looked at Kit.", "fer"], ["v3d_fer_0064_narrator.mp3", "narrator", "Kit buried his bright red face in his dad's apron and groaned. But Rook saw him smiling into it.", "fer"], ["v3d_fer_0065_kit.mp3", "kit", "Dad. The crack was weird. It was too straight. Like somebody made it.", "fer"], ["v3d_fer_0066_hank.mp3", "hank", "That's what I thought. Somebody's been poking around my tower. And I've got a pretty good idea who.", "fer"], ["v3d_fer_0067_narrator.mp3", "narrator", "He doesn't say the name. But Rook thinks of a crate in the scrap, stamped with an orange ring and a slash.", "fer"], ["v3d_fer_0070_narrator.mp3", "narrator", "From the planet, one by one, little lights are rising. Seeds. Gold and violet and green, lifting off and shooting away into the stars, like dandelion fluff blown off a stem.", "fer"], ["v3d_fer_0071_rook.mp3", "rook", "Zib? Was that... your home?", "fer"], ["v3d_fer_0072_narrator.mp3", "narrator", "It was the smallest bip Rook had ever heard.", "fer"], ["v3d_fer_0076_narrator.mp3", "narrator", "On its side, painted in curly, old-fashioned letters that someone had done by hand, was a name. Dandelion. And underneath the name, very small, was a picture. A tiny bird with its wings spread out. Exactly like the one on the badge.", "fer"], ["v3d_fer_0077_hank.mp3", "hank", "When Anvilox was just a pup, no bigger than a toolbox, he fell off a crane. Broke three of his legs. Every doctor on Ferrox shook their heads.", "fer"], ["v3d_fer_0079_hank.mp3", "hank", "She stayed three nights. Splinted his legs, sang to him. And on the fourth morning, he stood up.", "fer"], ["v3d_fer_0080_narrator.mp3", "narrator", "Kit was staring at his dad. Rook could tell Kit had never heard this story.", "fer"], ["v3d_fer_0081_hank.mp3", "hank", "She brought the Dandelion here. Asked me to keep it safe for her. I said, 'Wren, what am I keeping it safe for?' And she said, 'Someday my grandkid is going to need it. You'll know them when you see them, Hank. They'll have my chin.'.", "fer"], ["v3d_fer_0082_narrator.mp3", "narrator", "He reached into the pocket of his apron and took out a key. It was small and brass and old-fashioned, on a ring with a little round tag. The tag had the bird on it too.", "fer"], ["v3d_fer_0083_narrator.mp3", "narrator", "Rook took the key. His hand was shaking.", "fer"], ["v3d_fer_0085_narrator.mp3", "narrator", "At the little brass badge pinned over his heart. A cross. With a bird on it. He reached for it. He started to unpin it.", "fer"], ["v3d_fer_0086_narrator.mp3", "narrator", "Later, he thought. It had waited this long. It could wait a little longer.", "fer"], ["v3d_fer_0087_rook.mp3", "rook", "Kit? Are you coming?", "fer"], ["v3d_fer_0088_hank.mp3", "hank", "Go see the stars, kiddo. Fix everything that breaks. And come home and tell me about it.", "fer"], ["v3d_fer_0089_hank.mp3", "hank", "I'll keep the light on.", "fer"], ["v3d_fer_0090_narrator.mp3", "narrator", "He meant the tower. Kit knew it. Rook knew it.", "fer"], ["v3d_fer_0147_kid.mp3", "kid", "And nobody gets near the Forge Gate without beating me first.", "fer"], ["v3d_fer_0156_rook.mp3", "rook", "Wait. Briggs? Like you?", "fer"], ["v3d_fer_0157_kit.mp3", "kit", "He's my dad.", "fer"], ["v3d_fer_0158_rook.mp3", "rook", "Want a cactus-berry cookie? Oh. Wait. Sporix ate them all.", "fer"], ["v3d_fer_0159_rook.mp3", "rook", "I think it likes you.", "fer"], ["v3d_fer_0160_kit.mp3", "kit", "It likes my tools.", "fer"], ["v3d_fer_0161_rook.mp3", "rook", "Same thing. Kind of. Isn't it?", "fer"], ["v3d_fer_0162_kit.mp3", "kit", "It's late. Dad'll be asleep. Or at the tower. He's always at the tower. I know a better place anyway.", "fer"], ["v3d_fer_0163_rook.mp3", "rook", "Kit. Did you go somewhere last night?", "fer"], ["v3d_fer_0164_kit.mp3", "kit", "Couldn't sleep. Went for a walk. Five more minutes.", "fer"], ["v3d_fer_0165_hank.mp3", "hank", "RIGHT! Let's see what you've got!", "fer"], ["v3d_fer_0166_rook.mp3", "rook", "We did it. We beat the IRON WALL.", "fer"], ["v3d_fer_0167_rook.mp3", "rook", "A friend told me.", "fer"], ["v3d_fer_0168_hank.mp3", "hank", "Your first Signal Shard. A little piece of the heart of my tower. You earned it.", "fer"], ["v3d_fer_0170_hank.mp3", "hank", "You've got launch clearance. Go see the stars.", "fer"], ["v3d_fer_0171_kit.mp3", "kit", "ROOK! Dad says the launch window closes in five minutes! If we're going, we have to go NOW!", "fer"], ["v3d_fer_0172_kit.mp3", "kit", "Well, somebody's got to. This ship is like fifty years old. Something's going to fall off. You'll need an engineer. A good one. Which is me. If that's okay.", "fer"], ["v3d_fer_0173_rook.mp3", "rook", "That's MORE than okay.", "fer"]];
var L=document.getElementById("list");
function play(i,next){var r=ROWS[i],st=document.getElementById("st"+i);st.textContent="loading";delete fellBack[r[0]];
 var h=window.VPLAY(r[0]);var t0=performance.now();
 var iv=setInterval(function(){if(fellBack[r[0]]){st.textContent="game clip";}else if(performance.now()-t0>300&&st.textContent=="loading"){st.textContent="book"}},200);
