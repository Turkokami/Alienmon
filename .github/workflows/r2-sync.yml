# Copies the 3D game's models and audiobook from Vercel Blob to Cloudflare R2 (bucket alienmon-assets),
# so players download them from R2 instead of Vercel. Files already in R2 are skipped.
# Needs the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; until they exist it does nothing.
# Runs when a game file that lists Blob addresses changes, so new models get copied too.
name: Copy game files to Cloudflare R2
on:
  push:
    branches: [maps-v2]
    paths:
      - '.github/workflows/r2-sync.yml'
      - 'tools/r2/**'
      - 'sporeholm3d/assets.js'
      - 'sporeholm3d/newmons.js'
      - 'sporeholm3d/bookvoice-data.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: alienmon-assets
    steps:
      - name: Check the Cloudflare secrets are set
        id: keys
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "The Cloudflare secrets are not set yet, so there is nothing to copy." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'yes'
        with:
          sparse-checkout: |
            sporeholm3d/assets.js
            sporeholm3d/newmons.js
            sporeholm3d/bookvoice-data.js
            tools/r2
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'yes'
        with:
          node-version: '22'
      - name: Install wrangler
        if: steps.keys.outputs.ready == 'yes'
        run: npm install -g --no-fund --no-audit wrangler@4.169.0
      - name: Copy to R2 and check every file
        if: steps.keys.outputs.ready == 'yes'
        run: python3 tools/r2/sync.py
