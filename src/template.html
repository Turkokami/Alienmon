*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}

.dwrap{filter:drop-shadow(0 18px 40px #000b)}

 background:linear-gradient(120deg,#5ff2ff,#7a3fbf 40%,#ff8a1e);--cut:polygon(30px 0,calc(100% - 30px) 0,100% 30px,100% calc(100% - 44px),calc(100% - 44px) 100%,44px 100%,0 calc(100% - 44px),0 30px);clip-path:var(--cut)}

<div class="dwrap"><div class="device">
 <div class="top"><div class="lens"></div><div class="leds"><i></i><i></i><i></i></div><div class="grille"><i></i><i></i><i></i><i></i><i></i></div><div class="label"><b>XENODEX</b><span>ALIENMON · LINKER UNIT</span></div></div>

<script>
'use strict';
const D=__DATA__, PL=__PLANETS__, TRAITS=__TRAITS__, SIGS=__SIGS__, SYS=__SYS__, ART=__ART__, ARTB=__ARTB__, OW=__OW__, TITLE=__TITLE__, SHIP=__SHIP__, CUTS=__CUTS__, CHAR=__CHAR__, PORT=__PORTRAITS__, SCN=__SCENES__, FXD=__FX__, PLANART=__PLANETART__, BUILD=__BUILD__, INLINE=__INLINE__, BETA=__BETA__;
// art is loaded on first use (the web build serves each image as its own cached file), so the game starts fast
function lazyImgs(src){return new Proxy({},{get(t,k){if(typeof k!=='string')return undefined;if(!(k in t)&&src[k]){const i=new Image();i.decoding='async';i.src=src[k];t[k]=i}return t[k]},has:(t,k)=>k in src})}
function warm(imgs,keys){for(const k of keys)imgs[k]}
const PLI=lazyImgs(PLANART);
const FXI=lazyImgs(FXD);
const SCI=lazyImgs(SCN);
function cover(img,x,y,w,h,fx){const ir=img.naturalWidth/img.naturalHeight,tr=w/h;let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;if(ir>tr){sw=sh*tr;sx=(img.naturalWidth-sw)/2}else{sh=sw/tr;sy=(img.naturalHeight-sh)/2}
 ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(fx)ctx.filter=fx;ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);ctx.restore()}
const CHI=lazyImgs(CHAR),PORTI=lazyImgs(PORT);
// the speaker fills the screen above the text box: a full portrait when there is one, otherwise their sprite
function drawPortrait(k,bottom){const im=okI(PORTI[k])?PORTI[k]:okI(CHI[k])?CHI[k]:null;if(!im||bottom<30)return;
 ctx.fillStyle='rgba(18,12,34,0.78)';ctx.fillRect(0,0,160,bottom);const z=Math.min(bottom-2,112);
 ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,Math.round(80-z/2),bottom-z,z,z);ctx.restore()}
const okI=i=>i&&i.complete&&i.naturalWidth;
function dchar(k,x,y,w,h,flip){const i=CHI[k];if(!okI(i))return false;ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(flip){ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(i,0,0,w,h)}else ctx.drawImage(i,x,y,w,h);ctx.restore();return true}
const SHIPI=new Image();if(SHIP)SHIPI.src=SHIP;const CUTI=CUTS.map(u=>{const i=new Image();i.src=u;return i});
const TITLEI=new Image();if(TITLE)TITLEI.src=TITLE;
const ARTI=lazyImgs(ART),ARTBI=lazyImgs(ARTB),OWI=lazyImgs(OW);
const IDX={};D.forEach((d,i)=>IDX[d.name]=i);
const cv=document.getElementById('scr'),ctx=cv.getContext('2d');
ctx.setTransform(4,0,0,4,0,0);ctx.imageSmoothingEnabled=false;

/* ---------- utils ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
function txt(s,x,y,c='#fff',sz=8){ctx.fillStyle=c;ctx.font=sz+'px "PS2P Local","Press Start 2P",monospace';ctx.textBaseline='top';ctx.fillText(s,x,y)}
function wrap(s,n=18){const out=[];let line='';for(const w of String(s).split(' ')){if((line+' '+w).trim().length>n){if(line)out.push(line);line=w}else line=(line+' '+w).trim()}if(line)out.push(line);return out}
function box(x,y,w,h,bg='#f8f4ff',bd='#1b1424'){ctx.fillStyle=bd;ctx.fillRect(x,y,w,h);ctx.fillStyle=bg;ctx.fillRect(x+2,y+2,w-4,h-4)}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}

/* ---------- input ---------- */
const held={},pressed={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',Enter:'a',Space:'a',KeyX:'b',Backspace:'b',Escape:'start',KeyP:'start'};
addEventListener('keydown',e=>{if(e.code==='KeyG'&&typeof canFreeRoam==='function'&&canFreeRoam())pressed.g=true;const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(!held[k])pressed[k]=true;held[k]=true});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)held[k]=false});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(!held[k])pressed[k]=true;held[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});
 const up=()=>{held[k]=false;b.classList.remove('on')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
try{const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(A)A.addListener('backButton',()=>{pressed.b=true})}catch(e){}
const P_=k=>{const v=pressed[k];pressed[k]=false;return v};

/* ---------- types & moves ---------- */
const TYPES=['Plasma','Hydro','Bio','Volt','Cryo','Magma','Toxin','Swarm','Alloy','Crystal','Psi','Sonic','Gravity','Void'];
const TC={Plasma:['#ff8a1e','#ffd23f','#b34700'],Hydro:['#2e86de','#7fd3ff','#1b4f8a'],Bio:['#3fae49','#9be36b','#1f6b2a'],Volt:['#ffd400','#5ff2ff','#b38f00'],
Cryo:['#9fd8ff','#ffffff','#5b8fb8'],Magma:['#d7262e','#ff8c2a','#5a1a1a'],Toxin:['#8be000','#b45cff','#3a5a00'],Swarm:['#d9a032','#c7c25a','#5e3d1a'],
Alloy:['#8a95a5','#c87a3a','#4a5260'],Crystal:['#e23fbf','#c9a6ff','#7a1f6a'],Psi:['#ff74c4','#a35cff','#7a2a6e'],Sonic:['#19c3b0','#ff4fa3','#0f6e64'],
Gravity:['#8a6a4a','#5b6b8a','#3a2b4f'],Void:['#4a3570','#7a4fbf','#140e22']};
const SE=[['Bio','Hydro'],['Hydro','Plasma'],['Plasma','Bio'],['Hydro','Magma'],['Magma','Cryo'],['Cryo','Bio'],['Volt','Hydro'],['Crystal','Volt'],['Alloy','Crystal'],['Crystal','Plasma'],
['Sonic','Crystal'],['Magma','Alloy'],['Psi','Toxin'],['Void','Psi'],['Gravity','Swarm'],['Sonic','Void'],['Swarm','Psi'],['Toxin','Bio'],['Plasma','Swarm'],['Gravity','Volt'],['Cryo','Gravity'],['Volt','Alloy'],['Toxin','Sonic'],['Void','Gravity']];
function eff(mt,dts){if(mt==='None')return 1;let m=1;for(const d of dts){if(SE.some(p=>p[0]===mt&&p[1]===d))m*=2;else if(SE.some(p=>p[0]===d&&p[1]===mt)||d===mt)m*=0.5}return m}
const TM={
Plasma:[['Ember Pulse',40,100,{s:'burn',c:.1}],['Flare Lance',70,95,{}],['Solar Burst',95,85,{s:'burn',c:.2}],['Corona Charge',0,100,{self:{spa:2},c:1}]],
Hydro:[['Bubble Jet',40,100,{foe:{spe:-1},c:.1}],['Tide Lash',70,95,{}],['Abyss Surge',95,85,{}],['Healing Tide',0,100,{heal:.5}]],
Bio:[['Spore Shot',40,100,{s:'poison',c:.1}],['Root Drain',65,100,{drain:.5}],['Bloom Cannon',95,85,{}],['Photosynth',0,100,{heal:.5}]],
Volt:[['Static Zap',40,100,{s:'shock',c:.15}],['Arc Bolt',70,95,{s:'shock',c:.1}],['Thunder Coil',95,85,{}],['Static Field',0,90,{s:'shock',c:1}]],
Cryo:[['Frost Bite',40,100,{s:'freeze',c:.1}],['Ice Shard',70,95,{}],['Glacier Crush',95,85,{s:'freeze',c:.1}],['Frost Armor',0,100,{self:{def:2},c:1}]],
Magma:[['Cinder Spit',40,100,{s:'burn',c:.15}],['Lava Fist',70,95,{}],['Eruption Wave',95,85,{s:'burn',c:.2}],['Wildfire Glare',0,85,{s:'burn',c:1}]],
Toxin:[['Acid Drip',40,100,{foe:{spd:-1},c:.2}],['Venom Fang',70,95,{s:'poison',c:.25}],['Miasma Cloud',95,85,{s:'poison',c:.3}],['Toxic Mist',0,90,{s:'poison',c:1}]],
Swarm:[['Skitter Rush',40,100,{}],['Sting Volley',70,95,{s:'poison',c:.15}],['Hive Storm',95,85,{crit:1}],['Swarm Dance',0,100,{self:{atk:1,spe:1},c:1}]],
Alloy:[['Bolt Bash',40,100,{}],['Gear Grind',70,95,{foe:{def:-1},c:.2}],['Iron Avalanche',95,85,{}],['Plate Up',0,100,{self:{def:2},c:1}]],
Crystal:[['Shard Flick',40,100,{crit:1}],['Prism Beam',70,95,{foe:{spd:-1},c:.2}],['Crystal Nova',95,85,{}],['Prism Ward',0,100,{self:{spd:2},c:1}]],
Psi:[['Mind Poke',40,100,{s:'confuse',c:.1}],['Psi Wave',70,95,{s:'confuse',c:.1}],['Neural Storm',95,85,{foe:{spd:-1},c:.2}],['Mind Fog',0,90,{s:'confuse',c:1}]],
Sonic:[['Chirp Blast',40,100,{}],['Echo Pulse',70,95,{s:'confuse',c:.1}],['Sonic Boom',95,85,{}],['Shriek',0,100,{foe:{def:-2},c:1}]],
Gravity:[['Pebble Pull',40,100,{foe:{spe:-1},c:.2}],['Mass Slam',75,90,{}],['Gravity Well',95,85,{foe:{spe:-1},c:.3}],['Heavy Field',0,100,{foe:{spe:-2},c:1}]],
Void:[['Shade Claw',40,100,{crit:1}],['Null Bite',70,95,{foe:{atk:-1},c:.2}],['Event Horizon',95,85,{}],['Shadow Veil',0,100,{foe:{acc:-1},c:1}]]};
const MV=[{n:'Ram',t:'None',p:40,a:100,fx:{}}];const MVI={};
for(const t of TYPES)TM[t].forEach(([n,p,a,fx],i)=>{MVI[t+i]=MV.length;MV.push({n,t,p,a,fx})});
const SIGBASE=MV.length;SIGS.forEach(m=>MV.push({...m,sig:1}));
const PHYS=new Set(['None','Alloy','Swarm','Gravity','Magma','Void','Bio']);
function learnset(id){const d=D[id],t=d.t,t2=t[1]||t[0];const ls=[[1,0],[1,MVI[t[0]+0]],[7,MVI[t[0]+3]],[12,MVI[t2+0]],[20,MVI[t[0]+1]],[30,MVI[t2+(t[1]?1:3)]],[42,MVI[t[0]+2]],[55,MVI[t2+2]]];
 if(d.sig>=0)ls.push([d.tot===1?1:Math.min(36,evoFrom(id)),SIGBASE+d.sig]);return ls}
function evoFrom(id){for(let i=0;i<D.length;i++)if(D[i].to===D[id].name)return evoLv(i);return 1}
function mval(mi){const m=MV[mi];return m.sig?999:m.p||55}
function learn(m,mi,lines){if(m.moves.includes(mi))return;m.moves.push(mi);if(m.moves.length>4){let w=0;m.moves.forEach((x,i)=>{if(mval(x)<mval(m.moves[w]))w=i});const dr=m.moves.splice(w,1)[0];if(lines&&dr!==mi)lines.push(nm(m)+' forgot '+MV[dr].n+'.')}if(lines&&m.moves.includes(mi))lines.push(nm(m)+' learned '+MV[mi].n+'!')}
function movesAt(id,lv){const m={id,moves:[]};for(const[l,mi]of learnset(id).sort((a,b)=>a[0]-b[0]))if(l<=lv)learn(m,mi);return m.moves}
function evoLv(id){const d=D[id];if(!d.to)return 999;const t=D[IDX[d.to]];const m=/Level (\d+)/.exec(t.m);return m?+m[1]:(t.st===2?30:45)}
const TR=i=>TRAITS[D[i].tr];
/* ---------- mons ---------- */
const nm=m=>m.nick||D[m.id].name;

/* ---------- sprites ---------- */
const SPR={};
function sprite(id){if(SPR[id])return SPR[id];const d=D[id],r=rng(hash(d.name)),N=16,H=8;
 const big=d.r==='legendary'||d.r==='mythic'?0.12:0;let g=[];
 const sx=0.65+r()*0.6,sy=0.7+r()*0.45,oy=8+Math.floor(r()*3)-1;
 for(let y=0;y<N;y++){g[y]=[];for(let x=0;x<H;x++){const dx=(H-0.5-x)/(H*sx),dy=(y-oy)/(8*sy);g[y][x]=r()<0.7+big-0.8*(dx*dx+dy*dy)?1:0}}
 const at=(y,x)=>{if(y<0||y>=N)return 0;const xm=x>=H?2*H-1-x:x;return xm<0?0:g[y][xm]};
 for(let it=0;it<2;it++){const n=g.map(a=>a.slice());for(let y=0;y<N;y++)for(let x=0;x<H;x++){let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)c+=at(y+dy,x+dx);n[y][x]=c>=5?1:c<=2?0:g[y][x]}g=n}
 for(let y=0;y<N;y++){g[y][0]=0}g[0]=g[0].map(()=>0);g[N-1]=g[N-1].map(()=>0);
 let cnt=0;for(const row of g)for(const v of row)cnt+=v;
 if(cnt<26)for(let y=3;y<13;y++)for(let x=2;x<H;x++)if(((x-H)/6)**2+((y-8)/5)**2<1)g[y][x]=1;

function prefetch(){const c=navigator.connection;if(INLINE||(c&&(c.saveData||/2g/.test(c.effectiveType||''))))return;
 const scn=Object.values(QCUT_ART).map(v=>v[0]);for(const p of PL)for(const k of[p.key+'_landmark',p.landScene,p.scene,p.key+'_town_hd',p.key+'_arena',PAINT[p.key]&&PAINT[p.key].img])if(k&&SCN[k]&&!scn.includes(k))scn.push(k);
 const q=[...Object.keys(PORT).map(k=>[PORTI,k]),...Object.keys(CHAR).map(k=>[CHI,k]),...Object.keys(PLANART).map(k=>[PLI,k]),...scn.map(k=>[SCI,k]),...Object.keys(FXD).map(k=>[FXI,k]),

 let n=0;const next=()=>{if(!q.length)return;const[m,k]=q.shift(),i=m[k];if(!i||okI(i)){next();return}n++;const done=()=>{n--;next()};i.addEventListener('load',done,{once:true});i.addEventListener('error',done,{once:true})};

 if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.active&&r.active.postMessage({type:'cache-all'}))}
