<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Alienmon 3D</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0620;color:#eafff4;font-family:system-ui,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;
 background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 80%,#fff6,transparent),radial-gradient(1px 1px at 40% 70%,#fff5,transparent),radial-gradient(1px 1px at 85% 20%,#fff7,transparent),radial-gradient(1px 1px at 10% 85%,#fff6,transparent),radial-gradient(ellipse at 50% 120%,#1d4a52 0,transparent 60%)}
.card{width:min(560px,100%);text-align:center}
h1{margin:0 0 6px;font-size:44px;letter-spacing:1px;color:#c8f06a;text-shadow:0 0 18px #3fe0d055}
.sub{opacity:.7;margin-bottom:28px}
button{font:inherit;cursor:pointer;color:#fff;border-radius:12px}
#cont{display:block;width:100%;padding:16px;font-size:20px;font-weight:700;background:#1d4a52;border:2px solid #3fe0d0;margin-bottom:22px}
#cont:hover,#cont:focus{background:#256470;outline:none}
#cont{margin-bottom:10px}
#newg{display:block;width:100%;padding:12px;font-size:17px;font-weight:700;background:#16202e;border:2px solid #c8f06a;margin-bottom:22px}
#newg:hover,#newg:focus{background:#24321c;outline:none}
#ask{display:none;position:fixed;inset:0;background:rgba(4,8,20,.8);align-items:center;justify-content:center;padding:24px}
#ask .box{width:min(420px,100%);background:#0f2233;border:2px solid #c8f06a;border-radius:16px;padding:22px;text-align:center}
#ask h2{margin:0 0 8px;color:#c8f06a}#ask p{margin:0 0 18px;opacity:.85}
#ask .row{display:flex;gap:10px}#ask .row button{flex:1;padding:12px;font-size:17px;font-weight:700;background:#16202e;border:2px solid #345}
#ask .row button:hover,#ask .row button:focus{border-color:#c8f06a;background:#1c2a3c;outline:none}
.label{text-align:left;opacity:.7;font-size:13px;margin:0 0 8px 2px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{padding:14px 12px;font-size:16px;background:#16202e;border:1px solid #345;text-align:left}
.grid button:hover,.grid button:focus{border-color:#c8f06a;background:#1c2a3c;outline:none}
.grid small{display:block;opacity:.6;font-size:12px;margin-top:3px}
.keys{margin-top:26px;font-size:13px;opacity:.6;line-height:1.6}
.note{margin-top:16px;font-size:14px;opacity:.85;min-height:1.2em}
.note button{display:inline-block;width:auto;padding:6px 14px;margin-left:8px;font-size:14px;font-weight:700;background:#1d4a52;border:2px solid #3fe0d0}
.note button:hover,.note button:focus{border-color:#c8f06a;outline:none}
#upd{opacity:.7}
</style></head><body>
<div class="card">
  <h1>Alienmon 3D</h1>
  <div class="sub">Every world is on your PC. Plays offline.</div>
  <button id="cont">Continue</button>
  <button id="newg">New Game<small style="display:block;font-weight:400;font-size:12px;opacity:.65;margin-top:3px">Start over from the first cutscene</small></button>
  <div class="label">Pick a world</div>
  <div class="grid" id="worlds"></div>
  <div class="note" id="packnote" style="display:none">The new Alienmon aren't downloaded yet.<button id="getpack">Download</button></div>
  <div class="note" id="upd"></div>
  <div class="keys">F11 full screen · F10 back to this screen · Alt shows the menu</div>
</div>
<div id="ask"><div class="box"><h2>Start over?</h2><p>Your current save will be erased. Your settings stay.</p>
  <div class="row"><button id="yes">Yes</button><button id="no">No</button></div></div></div>
<script>
var W=[["dustara","Dustara",""],["sporeholm","Sporeholm","Mirefen Village"],["ferrox","Ferrox",""],["thalassa","Thalassa","In progress"],["neonis","Neonis","Preview"]];
var last=null;try{last=localStorage.getItem("am_world")}catch(e){}
var names={};W.forEach(function(w){names[w[0]]=w[1]});
var cont=document.getElementById("cont");
cont.textContent=last&&names[last]?"Continue on "+names[last]:"Start in Dustara";
cont.onclick=function(){location.href="/index.html"+(last&&names[last]?"":"?world=dustara")};
var g=document.getElementById("worlds");
W.forEach(function(w){var b=document.createElement("button");b.innerHTML=w[1]+(w[2]?"<small>"+w[2]+"</small>":"");b.onclick=function(){location.href="/index.html?world="+w[0]};g.appendChild(b)});
var hasSave=false;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/_rpg$|^sporeholm_|^am_world$/.test(k))hasSave=true}}catch(e){}
var ask=document.getElementById("ask"),newGame=function(){location.href="/index.html?newgame=1"};
document.getElementById("newg").onclick=function(){if(!hasSave){newGame();return}ask.style.display="flex";document.getElementById("no").focus()};
document.getElementById("yes").onclick=newGame;
document.getElementById("no").onclick=function(){ask.style.display="none";document.getElementById("newg").focus()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ask.style.display==="flex"){ask.style.display="none";document.getElementById("newg").focus()}
 if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&ask.style.display==="flex"){var a=document.activeElement&&document.activeElement.id==="yes"?"no":"yes";document.getElementById(a).focus()}});
cont.focus();
// New Alienmon pack (downloaded on first launch; skipped if the player chose to play without it)
fetch("/_pack/status").then(function(r){return r.json()}).then(function(s){if(!s.ready&&s.totalFiles){document.getElementById("packnote").style.display="block";document.getElementById("getpack").onclick=function(){location.href="/_ui/download.html"}}}).catch(function(){});
// Update button: checks Releases for a newer build, downloads it, installs it and restarts the game
var upd=document.getElementById("upd");
function mb(b){return Math.round(b/1048576)}
function showUpd(s){
  if(s.state==="available"){upd.style.opacity=1;upd.innerHTML="";upd.appendChild(document.createTextNode("A new version is ready: "+(s.title||s.latest)+"."));var b=document.createElement("button");b.textContent="Update";b.onclick=function(){fetch("/_update/start").then(function(){pollUpd()})};upd.appendChild(b);return}
  if(s.state==="downloading"){upd.style.opacity=1;upd.textContent="Downloading the update… "+mb(s.doneBytes)+" of "+mb(s.totalBytes)+" MB";setTimeout(pollUpd,700);return}
  if(s.state==="ready"){upd.style.opacity=1;upd.textContent="Installing the update. The game will close and open again by itself.";return}
  if(s.state==="error"){upd.style.opacity=1;upd.innerHTML="";upd.appendChild(document.createTextNode("The update didn't finish."));var r=document.createElement("button");r.textContent="Try again";r.onclick=function(){fetch("/_update/start").then(function(){pollUpd()})};upd.appendChild(r);return}
  upd.style.opacity=.6;upd.innerHTML="";upd.appendChild(document.createTextNode(s.state==="current"?"Up to date.":s.state==="offline"?"Couldn't check for updates (offline).":"Checking for updates…"));
  if(s.state==="current"||s.state==="offline"){var c=document.createElement("button");c.textContent="Check again";c.onclick=function(){upd.textContent="Checking for updates…";fetch("/_update/status?force=1").then(function(r){return r.json()}).then(showUpd)};upd.appendChild(c)}
}
function pollUpd(){fetch("/_update/status").then(function(r){return r.json()}).then(showUpd).catch(function(){})}
fetch("/_update/last").then(function(r){return r.json()}).then(function(l){if(l&&l.ok){upd.style.opacity=1;upd.textContent="Updated to the newest version."}else pollUpd()}).catch(pollUpd);
</script></body></html>
