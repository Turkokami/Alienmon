<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alienmon Map Editor</title><meta name="robots" content="noindex">
<style>
:root{--bg:#120c22;--panel:#1d1533;--line:#3b2a5c;--text:#e8e0ff;--muted:#a99cc9;--accent:#ffd23f;--cyan:#5ff2ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;color:var(--accent)}
select,input,textarea,button{font:inherit;color:var(--text);background:#2a2046;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button:hover{border-color:var(--cyan)}button.on{background:#3b2a5c;border-color:var(--accent);color:var(--accent)}
#save.hot{background:var(--accent);color:#1b1424;border-color:var(--accent);font-weight:600}
main{display:flex}#mapwrap{position:relative;flex:1;min-width:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#where{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px;font:12px monospace;color:var(--muted)}
#panel{flex:0 0 auto;width:var(--pw,clamp(440px,36vw,1100px));min-width:320px;max-width:75vw;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:10px 12px}
#panel h3{margin:14px 0 6px;color:var(--accent);font-size:14px}#panel label{display:block;margin:6px 0}#panel label input,#panel label select,#panel textarea{width:100%}
#panel label.row{display:flex;flex-wrap:nowrap}#panel label input[type=checkbox]{width:auto;flex:0 0 auto;margin:0 6px 0 0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,clamp(100px,6.5vw,200px)),1fr));gap:8px;margin-top:8px}
.pal{height:var(--cell,clamp(100px,6.5vw,200px));padding:6px;display:flex;align-items:center;justify-content:center;background:#d8cfee;border-radius:8px}
.grid>.hint{grid-column:1/-1}.lead+h3,.lead+#preview+h3{display:none}.pal small{display:block;font-size:11px;line-height:1.15;color:#1b1424;font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}.pal:has(small){flex-direction:column;gap:2px}.pal:has(small) img{min-height:0;flex:1 1 auto}.pal img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.pal.on{outline:3px solid var(--accent)}
.pal.mon span{display:block;width:100%;height:100%;background-size:200% 100%;background-position:0 0;background-repeat:no-repeat;image-rendering:pixelated}
#preview{position:sticky;top:-10px;z-index:2;background:var(--panel);padding:8px 0;border-bottom:1px solid var(--line);margin:-10px 0 8px}
#preview .box{height:clamp(220px,30vh,420px);display:flex;align-items:center;justify-content:center;background:#d8cfee;border-radius:10px}
#preview .box img{width:92%;height:92%;object-fit:contain;image-rendering:pixelated}
#preview .box span{width:200px;height:200px;background-size:200% 100%;background-repeat:no-repeat}
#preview .cap{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
#sizer{width:6px;cursor:col-resize;background:var(--line)}#sizer:hover{background:var(--cyan)}
.sizes{display:flex;gap:6px;align-items:center;margin:4px 0}
.sel{background:#2a2046;border:1px solid var(--accent);border-radius:8px;padding:8px;margin-bottom:8px}.sel button{margin-top:6px}
.good{color:#7dff9a;font-size:12px}.bad{color:#ff8080;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2046;border:1px solid var(--accent);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

/* tabs inside a group, the one-line purpose, numbered steps, swatches, and the on-map hint */
.subtabs{display:flex;gap:4px;margin:0 0 4px;flex-wrap:wrap}.subtabs button{flex:1 1 auto;font-size:13px;font-weight:600}
.lead{margin:2px 0 8px;font-size:13px;color:var(--text);opacity:.9}
.steps{margin:6px 0 10px;padding:0;list-style:none;counter-reset:st}.steps li{counter-increment:st;position:relative;padding-left:26px;margin:5px 0;font-size:13px}
.steps li:before{content:counter(st);position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#1b1424;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(255,255,255,.25)}
.brushes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px}.brushes button{text-align:left}
.legend div{font-size:12px;margin:3px 0;color:var(--muted)}.legend b{color:var(--text)}
#panel h4{margin:12px 0 4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
button:disabled{opacity:.45;cursor:default}
#tip{position:absolute;left:8px;top:8px;max-width:calc(100% - 330px);display:flex;gap:8px;align-items:center;background:rgba(18,12,34,.9);border:1px solid var(--accent);border-radius:8px;padding:5px 10px;font-size:13px;z-index:3}
#tip:empty{display:none}#tip button{padding:3px 8px;font-size:12px}#tip .tipb{display:flex;gap:6px;flex:0 0 auto}
button.go{background:#2f7d4a;border-color:#7dff9a;color:#fff;font-weight:700}#tip button.go{padding:6px 12px;font-size:14px}
#hand{display:none}#hand.on{background:var(--accent);color:#1b1424}
.seg{display:flex;gap:4px}.seg button{flex:1 1 0}
.sel.place{display:flex;gap:10px;align-items:center}.sel.place img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;background:#d8cfee;border-radius:6px;flex:0 0 auto}.sel.place .go{margin-top:6px;padding:8px 14px}
details.how{margin:8px 0;border:1px solid var(--line);border-radius:8px;padding:4px 8px}details.how summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}details.how[open] summary{margin-bottom:2px}


#modes{display:flex;gap:4px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
#modes button{display:flex;align-items:center;gap:6px;white-space:nowrap}#modes i{font-style:normal;font-size:16px}
#mapctl{position:absolute;right:8px;top:8px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
#mapctl button{min-width:38px;min-height:34px;background:rgba(42,32,70,.92)}#mapctl label{display:flex;gap:4px;align-items:center;background:rgba(42,32,70,.92);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,46px);gap:4px;margin:8px 0}
.pad button{font-size:20px;padding:0}.pad .c{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.padrow{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}.padrow h4{margin:4px 0 0;font-size:12px;color:var(--muted)}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}.scenes button{text-align:left;font-size:13px}
main{height:calc(100% - 96px)}

/* playtest controls over the map (touch screens) */
#playpad{display:none;position:absolute;left:0;right:0;bottom:10px;pointer-events:none;justify-content:space-between;align-items:flex-end;padding:0 12px}
#playpad.on{display:flex}#playpad .dp{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:4px;pointer-events:auto}
#playpad button{font-size:22px;padding:0;border-radius:12px;background:rgba(42,32,70,.85);touch-action:none;user-select:none;-webkit-user-select:none}
#playpad .ab{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}#playpad .ab button{width:68px;height:68px;border-radius:50%;font-weight:700}#playpad .ab button+button{margin-bottom:34px}
@media (max-width:820px), (pointer:coarse) and (max-width:1100px){
 #modes button{flex:1 1 0;min-width:0;padding:4px 2px}#modes button span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 html,body{overflow:hidden;overscroll-behavior:none}
 header{padding:6px 8px;gap:6px;flex-wrap:nowrap}header h1{display:none}
 header select{flex:1 1 0;min-width:0;padding:7px 6px}header .act{flex:0 0 auto;flex-wrap:nowrap}header .act button{padding:7px 10px}
 #modes{position:fixed;left:0;right:0;bottom:0;z-index:5;border-bottom:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom));gap:2px}
 #modes button{flex-direction:column;gap:1px;font-size:11px;border-color:transparent;background:transparent}
 #modes button.on{background:#3b2a5c;border-color:var(--accent)}#modes i{font-size:20px}
 main{flex-direction:column;height:calc(100% - 50px - 62px - env(safe-area-inset-bottom))}
 #mapwrap{flex:1 1 auto;min-height:120px}
 #sizer{display:flex;width:auto;height:22px;cursor:row-resize;align-items:center;justify-content:center;background:var(--panel);border-top:1px solid var(--line);touch-action:none}
 #sizer b{display:block;width:48px;height:5px;border-radius:3px;background:var(--muted)}
 #panel{width:auto;max-width:none;min-width:0;flex:0 0 auto;height:var(--ph,44%);border-left:0;padding:6px 10px 12px;overscroll-behavior:contain}
 #where{display:none}
 #preview{position:static;margin:0 0 6px}#preview .box{height:110px}#preview .sizes{display:none}
 .grid{grid-template-columns:repeat(auto-fill,minmax(var(--cell,76px),1fr));gap:6px}.pal{height:var(--cell,76px)}
 #panel button,#panel select,#panel input{min-height:36px}
 #toast{bottom:auto;top:58px;font-size:13px;left:10px;right:10px;transform:none;max-width:none}
 #tip{top:auto;bottom:8px;right:8px;max-width:none;font-size:12px;flex-wrap:wrap}#mapwrap.playing #tip{display:none}#tip .tipb{flex:1 1 100%}#tip .tipb button{flex:1 1 0;min-height:42px}
 #preview{display:none!important}.lead{font-size:12px;margin:2px 0 6px}
 #hand{display:block}#mapctl{max-width:none;left:8px;flex-wrap:nowrap;gap:3px}#mapctl button{min-width:36px;min-height:36px;padding:4px 6px}#mapctl label{padding:4px 6px;font-size:12px}
 #mapctl label span{display:none}#mapctl label:after{font-size:15px}#mapctl label[title^="Colour"]:after{content:"\25A6"}#mapctl label[title^="Show doors"]:after{content:"\1F6AA"}
 .seg button{min-height:42px}
 .lead+h3+p.hint:not(.full),.lead+#preview+h3+p.hint:not(.full){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
 .lead+h3+p.hint:not(.full):after{content:""}
 .subtabs button{padding:7px 4px}
}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(calc(var(--cell,clamp(100px,6.5vw,200px)) * 1.5),1fr))}.grid.wide .pal{height:var(--cell,clamp(100px,6.5vw,200px))}
</style></head><body>
<header><h1>Alienmon Map Editor</h1>
<select id="planet" title="World"></select><select id="view" title="Which map"></select>
<span class="row act"><button id="undo">&#8630; Undo</button><button id="save">Save</button></span>
</header>
<nav id="modes"></nav>
<main><div id="mapwrap"><canvas id="map"></canvas><div id="where"></div><div id="tip"></div>
<div id="playpad"><div class="dp"><span></span><button data-pp="up">&#9650;</button><span></span><button data-pp="left">&#9664;</button><span></span><button data-pp="right">&#9654;</button><span></span><button data-pp="down">&#9660;</button><span></span></div><div class="ab"><button id="ppb">B</button><button id="ppa">A</button></div></div>
<div id="mapctl"><button id="hand" title="Move the map with one finger (two fingers always work)">&#9995;</button><button id="zout" title="Zoom out">&minus;</button><button id="zfit" title="Fit the map on screen">Fit</button><button id="zin" title="Zoom in">+</button>
<label title="Colour the ground: green walkable, red wall, orange cut off"><input type="checkbox" id="walls"> <span>walkable</span></label><label title="Show doors"><input type="checkbox" id="showdoors" checked> <span>doors</span></label></div>
</div><div id="sizer" title="Drag to resize the panel"><b></b></div><aside id="panel"></aside></main>
<div id="toast"></div>
<script src="studio.js"></script>
<script src="design.js"></script>
<script src="play.js"></script>
<script src="editor.js"></script>
</body></html>
